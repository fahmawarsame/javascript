<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Country Information</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        .container {
            width: 450px;
            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        select {
            width: 100%;

            padding: 13px;

            border: 2px solid #ddd;
            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;

            outline: none;

            transition: 0.3s;
        }

        select:focus {
            border-color: #667eea;
        }

        .country-card {
            margin-top: 25px;

            padding: 25px;

            background: linear-gradient(135deg, #f8f9ff, #eef1ff);

            border-radius: 15px;

            text-align: left;

            display: none;
        }

        .country-card h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .info {
            display: flex;
            justify-content: space-between;

            padding: 12px 0;

            border-bottom: 1px solid #ddd;
        }

        .info:last-child {
            border-bottom: none;
        }

        .info strong {
            color: #444;
        }

        .info span {
            color: #667eea;
            font-weight: bold;
        }

        .emoji {
            font-size: 45px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌍 Country Explorer</h1>

        <p class="subtitle">
            Select a country to see its information
        </p>

        <label for="country">Choose a country:</label>

        <!-- onchange event -->
        <select id="country" onchange="showCountryInfo()">

            <option value="">-- Select a Country --</option>

            <option value="somalia">Somalia</option>
            <option value="uk">United Kingdom</option>
            <option value="usa">United States</option>
            <option value="france">France</option>
            <option value="japan">Japan</option>
            <option value="brazil">Brazil</option>
            <option value="canada">Canada</option>
            <option value="australia">Australia</option>

        </select>


        <!-- Country information -->
        <div id="countryInfo" class="country-card">

            <div id="emoji" class="emoji"></div>

            <h2 id="countryName"></h2>

            <div class="info">
                <strong>🏛️ Capital:</strong>
                <span id="capital"></span>
            </div>

            <div class="info">
                <strong>👥 Population:</strong>
                <span id="population"></span>
            </div>

            <div class="info">
                <strong>🌎 Continent:</strong>
                <span id="continent"></span>
            </div>

            <div class="info">
                <strong>💰 Currency:</strong>
                <span id="currency"></span>
            </div>

            <div class="info">
                <strong>🗣️ Language:</strong>
                <span id="language"></span>
            </div>

        </div>

    </div>


    <script>

        // Country data
        const countries = {

            somalia: {
                name: "Somalia",
                capital: "Mogadishu",
                population: "Around 19 million",
                continent: "Africa",
                currency: "Somali Shilling",
                language: "Somali",
                emoji: "🇸🇴"
            },

            uk: {
                name: "United Kingdom",
                capital: "London",
                population: "Around 69 million",
                continent: "Europe",
                currency: "Pound Sterling (£)",
                language: "English",
                emoji: "🇬🇧"
            },

            usa: {
                name: "United States",
                capital: "Washington, D.C.",
                population: "Around 340 million",
                continent: "North America",
                currency: "US Dollar ($)",
                language: "English",
                emoji: "🇺🇸"
            },

            france: {
                name: "France",
                capital: "Paris",
                population: "Around 68 million",
                continent: "Europe",
                currency: "Euro (€)",
                language: "French",
                emoji: "🇫🇷"
            },

            japan: {
                name: "Japan",
                capital: "Tokyo",
                population: "Around 123 million",
                continent: "Asia",
                currency: "Japanese Yen (¥)",
                language: "Japanese",
                emoji: "🇯🇵"
            },

            brazil: {
                name: "Brazil",
                capital: "Brasília",
                population: "Around 216 million",
                continent: "South America",
                currency: "Brazilian Real (R$)",
                language: "Portuguese",
                emoji: "🇧🇷"
            },

            canada: {
                name: "Canada",
                capital: "Ottawa",
                population: "Around 41 million",
                continent: "North America",
                currency: "Canadian Dollar (C$)",
                language: "English & French",
                emoji: "🇨🇦"
            },

            australia: {
                name: "Australia",
                capital: "Canberra",
                population: "Around 27 million",
                continent: "Oceania",
                currency: "Australian Dollar (A$)",
                language: "English",
                emoji: "🇦🇺"
            }

        };


        // This function runs when the user changes the dropdown
        function showCountryInfo() {

            // Get the selected country
            const selectedCountry =
                document.getElementById("country").value;


            // Get the information box
            const countryInfo =
                document.getElementById("countryInfo");


            // If no country is selected
            if (selectedCountry === "") {

                countryInfo.style.display = "none";

                return;
            }


            // Find the country information
            const country = countries[selectedCountry];


            // Put information into HTML
            document.getElementById("emoji").textContent =
                country.emoji;

            document.getElementById("countryName").textContent =
                country.name;

            document.getElementById("capital").textContent =
                country.capital;

            document.getElementById("population").textContent =
                country.population;

            document.getElementById("continent").textContent =
                country.continent;

            document.getElementById("currency").textContent =
                country.currency;

            document.getElementById("language").textContent =
                country.language;


            // Show the information box
            countryInfo.style.display = "block";
        }

    </script>

</body>
</html>
